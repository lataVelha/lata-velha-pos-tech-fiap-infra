name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ============================================================
  # CI · PLANO
  # Roda terraform plan (bootstrap + addons) em todo PR, sem
  # aplicar nada.
  # ============================================================
  plan:
    name: "CI · Terraform plan"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Autenticar na AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Instalar Terraform 1.10
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.x"

      - name: Resolver bucket de estado (S3)
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "STATE_BUCKET=lata-velha-tfstate-${ACCOUNT_ID}" >> $GITHUB_ENV

      - name: Terraform Plan — bootstrap
        run: |
          terraform -chdir=terraform/bootstrap init -reconfigure \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="region=${{ vars.AWS_REGION }}"
          terraform -chdir=terraform/bootstrap plan
        env:
          TF_VAR_region: ${{ vars.AWS_REGION }}

      - name: Terraform Plan — addons
        # Le os outputs reais do ultimo apply do bootstrap (state em S3) para
        # configurar os providers kubectl/helm — sem aplicar nada aqui.
        run: |
          echo "TF_VAR_cluster_endpoint=$(terraform -chdir=terraform/bootstrap output -raw cluster_endpoint)" >> $GITHUB_ENV
          echo "TF_VAR_cluster_ca_data=$(terraform -chdir=terraform/bootstrap output -raw cluster_certificate_authority_data)" >> $GITHUB_ENV
          echo "TF_VAR_cluster_name=$(terraform -chdir=terraform/bootstrap output -raw cluster_name)" >> $GITHUB_ENV

          terraform -chdir=terraform/addons init -reconfigure \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="region=${{ vars.AWS_REGION }}"
          terraform -chdir=terraform/addons plan
        env:
          TF_VAR_region: ${{ vars.AWS_REGION }}
          TF_VAR_state_bucket: ${{ env.STATE_BUCKET }}

  # ============================================================
  # CD · BOOTSTRAP
  # VPC + EKS + ECR. Só roda em push para main (nunca em PR).
  # ============================================================
  tf-bootstrap:
    name: "CD · Bootstrap · VPC + EKS + ECR"
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    outputs:
      cluster_endpoint: ${{ steps.outputs.outputs.cluster_endpoint }}
      cluster_ca_data: ${{ steps.outputs.outputs.cluster_ca_data }}
      cluster_name: ${{ steps.outputs.outputs.cluster_name }}
      state_bucket: ${{ steps.outputs.outputs.state_bucket }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Autenticar na AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Instalar Terraform 1.10
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.x"

      - name: Provisionar bucket de estado (S3)
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="lata-velha-tfstate-${ACCOUNT_ID}"
          echo "STATE_BUCKET=${BUCKET}" >> $GITHUB_ENV
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            aws s3 mb "s3://$BUCKET" --region ${{ vars.AWS_REGION }}
            aws s3api put-bucket-versioning \
              --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled
          fi

      - name: Terraform Init — bootstrap
        run: |
          terraform -chdir=terraform/bootstrap init -reconfigure \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="region=${{ vars.AWS_REGION }}"
        env:
          TF_VAR_region: ${{ vars.AWS_REGION }}

      - name: Terraform Apply — bootstrap
        run: terraform -chdir=terraform/bootstrap apply -auto-approve
        env:
          TF_VAR_region: ${{ vars.AWS_REGION }}

      - name: Exportar outputs do bootstrap
        id: outputs
        run: |
          echo "cluster_endpoint=$(terraform -chdir=terraform/bootstrap output -raw cluster_endpoint)" >> $GITHUB_OUTPUT
          echo "cluster_ca_data=$(terraform -chdir=terraform/bootstrap output -raw cluster_certificate_authority_data)" >> $GITHUB_OUTPUT
          echo "cluster_name=$(terraform -chdir=terraform/bootstrap output -raw cluster_name)" >> $GITHUB_OUTPUT
          echo "state_bucket=${STATE_BUCKET}" >> $GITHUB_OUTPUT

  # ============================================================
  # CD · ADDONS
  # ALB + Cluster Autoscaler + metrics-server.
  # ============================================================
  tf-addons:
    name: "CD · Addons · ALB + Autoscaler + Metrics Server"
    needs: tf-bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    concurrency:
      group: infra-addons
      cancel-in-progress: false

    env:
      TF_VAR_region: ${{ vars.AWS_REGION }}
      TF_VAR_state_bucket: ${{ needs.tf-bootstrap.outputs.state_bucket }}
      TF_VAR_cluster_endpoint: ${{ needs.tf-bootstrap.outputs.cluster_endpoint }}
      TF_VAR_cluster_ca_data: ${{ needs.tf-bootstrap.outputs.cluster_ca_data }}
      TF_VAR_cluster_name: ${{ needs.tf-bootstrap.outputs.cluster_name }}
      TF_VAR_aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      TF_VAR_aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_aws_session_token: ${{ secrets.AWS_SESSION_TOKEN }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Autenticar na AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Instalar Terraform 1.10
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.x"

      - name: Terraform Init — addons
        run: |
          terraform -chdir=terraform/addons init -reconfigure \
            -backend-config="bucket=${{ needs.tf-bootstrap.outputs.state_bucket }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Terraform Apply — addons
        run: terraform -chdir=terraform/addons apply -auto-approve

      - name: Exportar DNS do ALB
        run: echo "ALB → $(terraform -chdir=terraform/addons output -raw alb_dns_name)"
